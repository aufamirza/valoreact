<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 230" role="img" aria-labelledby="title">
  <title id="title">AIM TRAINER</title>
  <defs>
    <!-- Tactical Coral / Red Gradient -->
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5c6a" />
      <stop offset="100%" stop-color="#e83648" />
    </linearGradient>

    <!-- Cyan Energy Accent -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8aede6" />
      <stop offset="100%" stop-color="#72d6cf" />
    </linearGradient>

    <!-- Chrome Metallic Text Fill -->
    <linearGradient id="metalText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#f2f6fa" />
      <stop offset="100%" stop-color="#bccad6" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Teko:wght@700&amp;display=swap');
    .logo-main-text {
      font-family: 'Teko', 'Chakra Petch', 'Rajdhani', 'Impact', sans-serif;
      font-size: 195px;
      font-weight: 700;
      letter-spacing: 7px;
      text-transform: uppercase;
      fill: url(#metalText);
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.9));
    }
    .logo-bracket {
      fill: none;
      stroke: url(#coralGrad);
      stroke-width: 9;
      stroke-linecap: square;
    }
  </style>

  <!-- Left Tactical Reticle Emblem (Properly Scaled & Centered, No Clipping) -->
  <g filter="url(#glow)">
    <!-- Outer Precision Ring Segments (r=85, cx=125, cy=115) -->
    <path d="M 125 30 A 85 85 0 0 1 210 115" class="logo-bracket" stroke-dasharray="52 20" />
    <path d="M 210 115 A 85 85 0 0 1 125 200" class="logo-bracket" stroke-dasharray="52 20" />
    <path d="M 125 200 A 85 85 0 0 1 40 115" class="logo-bracket" stroke-dasharray="52 20" />
    <path d="M 40 115 A 85 85 0 0 1 125 30" class="logo-bracket" stroke-dasharray="52 20" />

    <!-- Center Reticle Circle (r=50) -->
    <circle cx="125" cy="115" r="50" fill="none" stroke="#f7f9fc" stroke-width="5" opacity="0.9" />

    <!-- Inner Target Crosshair Lines -->
    <path d="M 125 36 L 125 76 M 125 154 L 125 194 M 46 115 L 86 115 M 164 115 L 204 115"
          stroke="#f7f9fc" stroke-width="8" stroke-linecap="round" />

    <!-- Glowing Center Pip -->
    <circle cx="125" cy="115" r="11" fill="url(#coralGrad)" />
    <circle cx="125" cy="115" r="4" fill="#ffffff" />

    <!-- 4 Tactical Outer Chamfer Accents -->
    <polygon points="125,18 132,27 118,27" fill="#ff5c6a" />
    <polygon points="125,212 132,203 118,203" fill="#ff5c6a" />
    <polygon points="28,115 37,108 37,122" fill="#ff5c6a" />
    <polygon points="222,115 213,108 213,122" fill="#ff5c6a" />
  </g>

  <!-- Typography: AIM TRAINER -->
  <g transform="translate(265, 0)" filter="url(#glow)">
    <!-- Main Bold Hero Text -->
    <text x="0" y="166" class="logo-main-text">AIM TRAINER</text>

    <!-- High-impact Cyber Underline Strip -->
    <rect x="0" y="186" width="220" height="4" fill="url(#coralGrad)" />
    <rect x="228" y="186" width="42" height="4" fill="url(#cyanGrad)" />
    <rect x="278" y="186" width="760" height="2" fill="rgba(255, 255, 255, 0.28)" />
  </g>
</svg>
